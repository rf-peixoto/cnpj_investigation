<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}CNPJ // correlation platform{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/jetbrains-mono.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="prompt">▌</span> cnpj<b>scope</b></div>
    <nav class="nav">
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint=='index' }}">campaigns</a>
      <a href="{{ url_for('search') }}" class="{{ 'active' if request.endpoint=='search' }}">global search</a>
      <a href="{{ url_for('partners') }}" class="{{ 'active' if request.endpoint=='partners' }}">serial partners</a>
      <a href="{{ url_for('watchlist') }}" class="{{ 'active' if request.endpoint=='watchlist' }}">watchlist</a>
      <a href="{{ url_for('queue_page') }}" class="{{ 'active' if request.endpoint=='queue_page' }}">queue</a>
    </nav>
    <div class="spacer"></div>
    <span class="faint mono-sm">fraud correlation toolkit</span>
  </div>
  <main class="wrap {% block wrapclass %}{% endblock %}">
    {% block body %}{% endblock %}
  </main>
  <div id="toast" class="toast"></div>
  <script>
    const CSRF = document.querySelector('meta[name="csrf-token"]').content;
    // csrf-aware POST helper: accepts FormData or object; always sends token
    function postForm(url, data) {
      const fd = data instanceof FormData ? data : new FormData();
      if (!(data instanceof FormData) && data) {
        for (const k in data) fd.append(k, data[k]);
      }
      fd.append('csrf_token', CSRF);
      return fetch(url, {method: 'POST', body: fd, headers: {'X-CSRF-Token': CSRF}});
    }
    function toast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
      clearTimeout(window.__tt); window.__tt = setTimeout(() => t.className = 'toast', 3200);
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
